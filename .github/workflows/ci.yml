# Checks every push and pull request: the Go server (vet, format, unit tests, and the
# integration tests against a real Postgres) and the Expo app (types, lint, format, tests).
name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  backend:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: backend
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: snookit
          POSTGRES_PASSWORD: ci-only-password
          POSTGRES_DB: snookit_test
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U snookit" --health-interval 5s --health-timeout 5s --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: backend/go.mod
          cache-dependency-path: backend/go.sum
      - name: Format
        run: test -z "$(gofmt -l .)" || (gofmt -l . && exit 1)
      - run: go vet ./... && go vet -tags integration ./...
      - run: go test ./...
      - name: Integration tests (real Postgres)
        env:
          TEST_DATABASE_URL: postgres://snookit:ci-only-password@localhost:5432/snookit_test?sslmode=disable
        run: go test -tags integration -count=1 ./internal/integration

  frontend:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npx tsc --noEmit
      - run: npm run lint
      - run: npm run format:check
      - run: npm test -- --ci
